name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_debug:
        description: "ساخت APK دیباگ به‌جای ریلیز"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: آماده‌سازی Android SDK
        uses: android-actions/setup-android@v3

      - name: ساخت google-services.json از Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret با نام GOOGLE_SERVICES_JSON_BASE64 تنظیم نشده است."
            echo "فایل google-services.json خود را base64 کنید و در Secrets مخزن قرار دهید."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "google-services.json ساخته شد ($(wc -c < app/google-services.json) بایت)"

      - name: ساخت Keystore از Secrets
        if: ${{ github.event.inputs.build_debug != 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده؛ APK بدون امضا ساخته می‌شود و قابل نصب/انتشار نیست."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: اجرای تست واحد
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: ساخت APK (ریلیز)
        if: ${{ github.event.inputs.build_debug != 'true' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ساخت APK (دیباگ)
        if: ${{ github.event.inputs.build_debug == 'true' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: نام‌گذاری خروجی
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/payamak-nashnas-1.0.0.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "out/payamak-nashnas-1.0.0-debug.apk"
          fi
          ls -lh out

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payamak-nashnas-apk
          path: out/*.apk
          if-no-files-found: error

      - name: گزارش نتیجه
        run: |
          echo "### نتیجه ساخت" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| فایل | حجم |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in out/*.apk; do
            echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
